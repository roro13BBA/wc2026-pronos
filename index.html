function calcOdds(tH, tA) {
  const sH = TEAM_STRENGTH[tH] || 55;
  const sA = TEAM_STRENGTH[tA] || 55;

  // Force relative avec avantage domicile (~+5% en CDM)
  const fH = Math.pow(sH / 100, 2.5) * 1.08;
  const fA = Math.pow(sA / 100, 2.5);

  // Probabilité de nul selon l'écart de niveau
  // Statistique réelle CDM : ~22-26% de nuls en phase de groupes
  // Plus l'écart est faible → plus de nuls
  const diff = Math.abs(sH - sA);
  const drawProb = diff < 5  ? 0.27  // très équilibrés → beaucoup de nuls
                : diff < 12 ? 0.25
                : diff < 20 ? 0.23
                : diff < 30 ? 0.20
                : 0.16; // gros écart → peu de nuls

  const tot = fH + fA;
  const pH = (fH / tot) * (1 - drawProb);
  const pA = (fA / tot) * (1 - drawProb);
  const pN = drawProb;

  // Marge bookmaker 7%
  const m = 1.07;
  const raw = p => Math.max(1.04, Math.round((1 / (p * m)) * 100) / 100);
  return { h: raw(pH), n: raw(pN), a: raw(pA) };
}

// Matchs éligibles pour le joker Surprise (écart TEAM_STRENGTH >= 15)
function getUpsetMatches() {
  return Object.entries(GROUPS).flatMap(([grp,{teams,matches}]) =>
    matches.map((m,mIdx) => {
      const tH=teams[m[0]], tA=teams[m[1]];
      const sH=TEAM_STRENGTH[tH]||55, sA=TEAM_STRENGTH[tA]||55;
      const diff=Math.abs(sH-sA);
      if(diff<15) return null;
      const favorite = sH>sA ? tH : tA;
      const underdog = sH>sA ? tA : tH;
      const mult = diff>20 ? 5 : 3;
      const sched=m[2]||{};
      return { key:`${grp}_${mIdx}`, grp, mIdx, favorite, underdog, diff, mult,
               label:`${F(underdog)} ${underdog} vs ${F(favorite)} ${favorite}`,
               date:sched.d, time:sched.h };
    }).filter(Boolean)
  );
}
const PLAYERS_KEY="wc2026_players_v4", RESULTS_KEY="wc2026_results_v4", SYNC_KEY="wc2026_lastsync";

function scoreResult(h,a){if(h>a)return"H";if(h<a)return"A";return"N";}

function computeScore(picks,results){
  let pts=0;
  Object.entries(GROUPS).forEach(([grp,{teams,matches}])=>{
    matches.forEach((matchDef,mIdx)=>{
      const key=`${grp}_${mIdx}`;
      const p=picks?.groups?.[key], r=results?.groups?.[key];
      if(!p||!r||p.h===""||p.a===""||r.h===""||r.a==="")return;
      const pH=parseInt(p.h),pA=parseInt(p.a),rH=parseInt(r.h),rA=parseInt(r.a);
      if(isNaN(pH)||isNaN(pA)||isNaN(rH)||isNaN(rA))return;
      if(pH===rH&&pA===rA){pts+=PTS.groupExact;}
      else if(scoreResult(pH,pA)===scoreResult(rH,rA)){pts+=PTS.groupResult;}
      if(pH===rH||pA===rA)pts+=PTS.groupGoal;
    });
  });
  return pts;
}

// ─── SYNC SCORES VIA CLAUDE API ───────────────────────────────────────────────
async function fetchScoresFromClaude(results) {
  const matchList = Object.entries(GROUPS).flatMap(([grp,{teams,matches}]) =>
    matches.map(([i,j],mIdx)=>`${grp}_${mIdx}: ${teams[i]} vs ${teams[j]}`)
  ).join("\n");

  const prompt = `Coupe du Monde 2026 (11 juin - 19 juillet 2026, USA/Canada/Mexique).
Cherche sur le web les scores OFFICIELS ET DÉFINITIFS des matchs déjà joués.

Matchs disponibles:
${matchList}

Réponds UNIQUEMENT avec du JSON valide, sans markdown, sans texte:
{"groups":{"A_0":{"h":2,"a":1},"B_2":{"h":0,"a":0}}}

N'inclus QUE les matchs terminés. Si aucun match joué: {"groups":{}}`;

  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      messages:[{role:"user",content:prompt}]
    })
  });
  const data = await resp.json();
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean);
  if(parsed.groups){
    return {...results, groups:{...(results.groups||{}), ...parsed.groups}};
  }
  return results;
}

async function dbGet(key) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/data?key=eq.${key}&select=value`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    return rows.length > 0 ? JSON.parse(rows[0].value) : null;
  } catch(e) { return null; }
}

async function dbSet(key, value) {
  try {
    const body = JSON.stringify({ key, value: JSON.stringify(value) });
    // Upsert
    await fetch(`${SUPABASE_URL}/rest/v1/data`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
      },
      body
    });
  } catch(e) {}
}

function loadLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e) { return fallback; }
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
}
async function loadShared(key, fallback) {
  const r = await dbGet(key);
  return r !== null ? r : fallback;
}
async function saveShared(key, value) {
  await dbSet(key, value);
}
async function saveAll(key, value) {
  saveLocal(key, value);
  await dbSet(key, value);
}
async function loadBest(key, fallback) {
  const local = loadLocal(key, null);
  const shared = await dbGet(key);
  if (shared !== null) {
    if (Array.isArray(shared) && Array.isArray(local) && local.length > shared.length) {
      await dbSet(key, local);
      return local;
    }
    saveLocal(key, shared);
    return shared;
  }
  return local !== null ? local : fallback;
}

            const localGrilles = (localPlayer.grilles || []).length;
            const remoteJokers = (remotePlayer.jokers || []).length;
            const localJokers = (localPlayer.jokers || []).length;
            if (localGrilles > remoteGrilles || localJokers > remoteJokers) {
              return localPlayer; // local plus récent
            }
            return remotePlayer;
          });
          // Ajoute les joueurs locaux pas encore sur le serveur
          local.forEach(lp => {
            if (!merged.find(m => m.name === lp.name)) merged.push(lp);
          });
          saveLocal(PLAYERS_KEY, merged);
          setPlayers(merged);
        }
        if(r !== null) { saveLocal(RESULTS_KEY, r); setResults(r); }
      } catch(e) {}
    }, 20000);
    return ()=>clearInterval(id);
  },[]);

  // Auto-sync scores toutes les 30 min (une seule instance à la fois)
  useEffect(()=>{
    const doSync = async () => {
      if(syncRef.current) return;
      const ls = await loadShared(SYNC_KEY, null);
      const now = Date.now();
      if(ls && now - ls < 25*60*1000) return; // moins de 25 min depuis dernier sync
      syncRef.current = true;
      try {
        const r = await loadShared(RESULTS_KEY,{groups:{},ko:{r32:[],qf:[],sf:[],final:[]}});
        const updated = await fetchScoresFromClaude(r);
        await saveShared(RESULTS_KEY, updated);
        await saveShared(SYNC_KEY, now);
        setResults(updated); setLastSync(now);
      } catch(e){}
      syncRef.current = false;
    };
    doSync();
    const id = setInterval(doSync, 30*60*1000);
    return ()=>clearInterval(id);
  },[]);

  const savePlayers = async p => { setPlayers(p); await saveAll(PLAYERS_KEY, p); };

  const login = (name) => {
    setCurrentUser(name);
    try { localStorage.setItem('wc2026_user', name); } catch(e) {}
  };
  const saveResults = async r => { setResults(r); await saveAll(RESULTS_KEY, r); };

  const manualSync = async () => {
    if(syncRef.current) return;
    syncRef.current = true;
    try {
      const updated = await fetchScoresFromClaude(results);
      const now = Date.now();
      await saveShared(RESULTS_KEY, updated);
      await saveShared(SYNC_KEY, now);
      setResults(updated); setLastSync(now);
    } catch(e){}
    syncRef.current = false;
  };

  const curPlayerObj = players.find(p=>p.name===currentUser);

  // Loader supprimé — données chargées depuis localStorage immédiatement

  if(screen==="onboarding") return (
    <Onboarding players={players} onJoin={async name=>{
      isRegistering.current = true; // pause polling
      const existing = players.find(p=>p.name.toLowerCase()===name.toLowerCase());
      if(existing){
        login(existing.name);
        setScreen("main");
        isRegistering.current = false;
        return;
      }
      const newPlayer = {name, grilles:[]};
      const updated=[...players, newPlayer];
      setPlayers(updated);
      saveLocal(PLAYERS_KEY, updated); // local immédiat
      await saveShared(PLAYERS_KEY, updated); // partagé
      login(name);
      setEditGrille({playerName:name,idx:0});
      setScreen("grid");
      // Reprend le polling après 10s (le temps de remplir la grille)
      setTimeout(()=>{ isRegistering.current = false; }, 10000);
    }} />
  );

  if(screen==="grid") return (
    <GridScreen
      player={players.find(p=>p.name===editGrille.playerName)}
      grilleIdx={editGrille.idx}
      results={results}
      onSave={async picks=>{
        const updated=[...players];
        const pi=updated.findIndex(p=>p.name===editGrille.playerName);
        const g=[...(updated[pi].grilles||[])];
        g[editGrille.idx]=picks;
        updated[pi]={...updated[pi],grilles:g};
        await savePlayers(updated);
        // Si c'est la première grille et pas encore de jokers → écran jokers
        const hasJokers = updated[pi].jokers && updated[pi].jokers.type;
        if(!hasJokers && editGrille.idx === 0) {
          setPendingPicks({playerName: editGrille.playerName});
          setScreen("jokers");
        } else {
          setTab("score"); setScreen("main");
        }
      }}
      onBack={()=>setScreen("main")}
    />
  );

  if(screen==="jokers") return (
    <JokersScreen
      playerName={pendingPicks?.playerName}
      onConfirm={async jokers=>{
        isRegistering.current = true; // pause polling
        const updated=[...players];
        const pi=updated.findIndex(p=>p.name===pendingPicks?.playerName);
        updated[pi]={...updated[pi],jokers};
        setPlayers(updated);
        saveLocal(PLAYERS_KEY, updated);
        await saveShared(PLAYERS_KEY, updated);
        isRegistering.current = false;
        setTab("score"); setScreen("main");
      }}
      onSkip={()=>{ setTab("score"); setScreen("main"); }}
    />
  );

  return (
    <div style={styles.app}>
      <Background />
      <div style={styles.content}>
        {tab==="score" && (
          <ScoreTab
            currentUser={currentUser}
            players={players}
            results={results}
            onLogin={()=>setScreen("onboarding")}
            onAddGrille={idx=>{ setEditGrille({playerName:currentUser,idx}); setScreen("grid"); }}
            onEditGrille={(name,idx)=>{ setEditGrille({playerName:name,idx}); setScreen("grid"); }}
          />
        )}
        {tab==="matchs" && (
          <MatchsTab results={results} lastSync={lastSync} isAdmin={isAdmin} players={players}
            onSync={manualSync} onResultChange={saveResults}
            onAdminLogin={pwd=>{ if(pwd==="wc2026admin")setIsAdmin(true); }} />
        )}
        {tab==="classement" && (
          <ClassementTab players={players} results={results} currentUser={currentUser} />
        )}
        {tab==="jokers" && (
          <JokersTab
            currentUser={currentUser}
            players={players}
            results={results}
            onChooseJokers={()=>{
              setPendingPicks({playerName:currentUser});
              setScreen("jokers");
            }}
            onSaveJokers={async (jokers) => {
              isRegistering.current = true;
              const updated=[...players];
              const pi=updated.findIndex(p=>p.name===currentUser);
              if(pi>=0){
                updated[pi]={...updated[pi],jokers};
                setPlayers(updated);
                saveLocal(PLAYERS_KEY, updated);
                await saveShared(PLAYERS_KEY, updated);
              }
              isRegistering.current = false;
            }}
            onActivateJoker={async (jokerId, target) => {
              isRegistering.current = true;
              const updated=[...players];
              const pi=updated.findIndex(p=>p.name===currentUser);
              if(pi>=0){
                const usedJokers={...(updated[pi].usedJokers||{}), [jokerId]: target};
                updated[pi]={...updated[pi],usedJokers};
                setPlayers(updated);
                saveLocal(PLAYERS_KEY, updated);
                await saveShared(PLAYERS_KEY, updated);
              }
              isRegistering.current = false;
            }}
          />
        )}
      </div>
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

function generateWhatsAppRecap(grp, results, players) {
  const {teams, matches} = GROUPS[grp];
  const lines = [`⚽ *RÉCAP GROUPE ${grp} - CDM 2026*\n`];

  let hasAnyResult = false;

  matches.forEach((matchDef, mIdx) => {
    const i=matchDef[0], j=matchDef[1], sched=matchDef[2]||{};
    const key=`${grp}_${mIdx}`;
    const r=(results.groups||{})[key];
    if(!r||r.h===""||r.a==="") return;
    hasAnyResult = true;

    const rH=parseInt(r.h), rA=parseInt(r.a);
    lines.push(`${F(teams[i])} *${teams[i]} ${r.h}-${r.a} ${teams[j]}* ${F(teams[j])}`);

    const picks = players.flatMap(p =>
      (p.grilles||[]).map((g,gi) => {
        if(!g) return null;
        const pick=g.groups?.[key];
        if(!pick||pick.h===""||pick.a==="") return null;
        const pH=parseInt(pick.h), pA=parseInt(pick.a);
        let status="wrong", pts=0, label="Raté ❌";
        if(pH===rH&&pA===rA){status="exact";pts=5;label="Score exact 🎯";}
        else if((pH>pA&&rH>rA)||(pH<pA&&rH<rA)||(pH===pA&&rH===rA)){status="good";pts=2;label="Bon résultat ✅";}
        if(status!=="wrong"&&(pH===rH||pA===rA))pts+=1;
        return {name:p.name+(gi>0?` (G${gi+1})`:""), pick:`${pH}-${pA}`, label, pts};
      }).filter(Boolean)
    );

    if(picks.length>0){
      picks.forEach(pw=>{
        lines.push(`  ${pw.label} · ${pw.name} · ${pw.pick}${pw.pts>0?` · +${pw.pts}pts`:""}`);
      });
    }
    lines.push("");
  });

  if(!hasAnyResult) return null;

  // Classement global
  const scored = players
    .filter(p=>(p.grilles||[]).length>0)
    .map(p=>{
      const scores=(p.grilles||[]).map(g=>g?computeScore(g,results):0);
      return{name:p.name, best:scores.length>0?Math.max(...scores):0};
    })
    .sort((a,b)=>b.best-a.best);

  lines.push("🏆 *CLASSEMENT*");
  scored.slice(0,5).forEach((p,i)=>{
    const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
    lines.push(`${medals[i]} ${p.name} · ${p.best} pts`);
  });

  const total = players.reduce((s,p)=>s+(p.grilles||[]).length*MISE,0);
  lines.push(`\n💰 Cagnotte : ${total}€`);
  lines.push("📱 Pronostics sur l'app !");

  return lines.join("\n");
}

                    if(r&&r.h!==""&&r.a!==""){
                      if(pH===rH&&pA===rA){status="exact";pts=5;label="Score exact";}
                      else if((pH>pA&&rH>rA)||(pH<pA&&rH<rA)||(pH===pA&&rH===rA)){status="good";pts=2;label="Bon résultat";}
                      else{status="wrong";pts=0;label="Raté";}
                      if(status!=="wrong"&&(pH===rH||pA===rA))pts+=1;
                    }
                    return {name:p.name,gi,pick:`${pH}-${pA}`,status,pts,label};
                  }).filter(Boolean)
                );
                if(playersWithPick.length===0) return(
                  <div style={styles.pronosEmpty}>Aucun pronostic pour ce match</div>
                );
                return(
                  <div style={styles.pronosPanel} onClick={e=>e.stopPropagation()}>
                    <div style={styles.pronosTitle}>Pronostics</div>
                    {playersWithPick.map((pw,idx)=>{
                      const dot = pw.status==="exact"?"🟢":pw.status==="good"?"🟡":pw.status==="pending"?"⚪":"🔴";
                      return(
                        <div key={idx} style={styles.pronosRow}>
                          <span style={styles.pronosDot}>{dot}</span>
                          <span style={styles.pronosName}>{pw.name}{pw.gi>0?` (G${pw.gi+1})`:""}</span>
                          <span style={styles.pronosPick}>{pw.pick}</span>
                          {pw.status!=="pending"&&<span style={{...styles.pronosResult,...(pw.status==="exact"?{color:C.green}:pw.status==="good"?{color:C.gold}:{color:C.red})}}>{pw.label} {pw.pts>0?`+${pw.pts}pts`:""}</span>}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>

      {/* Admin login */}
      {!isAdmin&&(
        <div style={styles.section}>
          {!showAdminPwd
            ?<button style={styles.btnMuted} onClick={()=>setShowAdminPwd(true)}>⚙️ Accès admin</button>
            :<div style={styles.adminLoginRow}>
              <input style={styles.fieldInput} type="password" placeholder="Code admin"
                value={adminPwd} onChange={e=>setAdminPwd(e.target.value)}/>
              <button style={styles.btnGold} onClick={()=>onAdminLogin(adminPwd)}>OK</button>
            </div>
          }
        </div>
      )}
    </div>
  );
}

// ─── CLASSEMENT TAB ───────────────────────────────────────────────────────────
function ClassementTab({players,results,currentUser}){
  const scored=players
    .map(p=>{
      const grilles=p.grilles||[];
      const scores=grilles.map(g=>g?computeScore(g,results):0);
      const best=scores.length>0?Math.max(...scores):0;
      return{...p,best,scores,totalMise:grilles.length*MISE};
    })
    .sort((a,b)=>b.best-a.best);

  const total=players.reduce((s,p)=>s+(p.grilles||[]).length*MISE,0);
  const pot=[Math.round(total*0.6),Math.round(total*0.3),Math.round(total*0.1)];
  const medals=["🥇","🥈","🥉"];
  const podiumColors=["#FFD700","#C0C0C0","#CD7F32"];

  return(
    <div style={styles.tabPage}>
      <h2 style={styles.tabTitle}>Classement</h2>

      {/* Cagnotte */}
      <div style={styles.potCard}>
        <div style={styles.potLabel}>💰 Cagnotte totale</div>
        <div style={styles.potAmount}>{total}€</div>
        <div style={styles.potPrizes}>
          <div style={styles.potPrize}><span>🥇</span><span style={{color:podiumColors[0]}}>{pot[0]}€</span></div>
          <div style={styles.potPrize}><span>🥈</span><span style={{color:podiumColors[1]}}>{pot[1]}€</span></div>
          <div style={styles.potPrize}><span>🥉</span><span style={{color:podiumColors[2]}}>{pot[2]}€</span></div>
        </div>
      </div>

      {/* Classement */}
      {scored.length===0&&<p style={styles.empty}>Aucune grille remplie pour l'instant.</p>}
      {scored.map((p,i)=>{
        const isMe=p.name===currentUser;
        return(
          <div key={p.name} style={{...styles.rankRow,...(isMe?styles.rankRowMe:{}),...(i===0?styles.rankRowFirst:{})}}>
            <div style={{...styles.rankBadge,...(i<3?{color:podiumColors[i]}:{})}}>{medals[i]||`${i+1}`}</div>
            <div style={styles.rankInfo}>
              <div style={styles.rankName}>{p.name}{isMe&&" (toi)"}</div>
              <div style={styles.rankGrilles}>
                {(p.grilles||[]).map((_,gi)=>(
                  <span key={gi} style={styles.rankGrilleTag}>G{gi+1}·{p.scores[gi]}pts</span>
                ))}
              </div>
            </div>
            <div style={styles.rankRight}>
              <div style={styles.rankScore}>{p.best}</div>
              <div style={styles.rankPts}>pts</div>
              {pot[i]>0&&<div style={styles.rankPrize}>{pot[i]}€</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── JOKER CARD ───────────────────────────────────────────────────────────────
function JokerCard({ joker, selected, onSelect, maxReached }) {
  const [flipped, setFlipped] = useState(false);
  const [tilt, setTilt] = useState({x:0,y:0});
  const [shine, setShine] = useState({x:50,y:40});
  const ref = useRef(null);
  const disabled = !selected && maxReached;

  const onMove = e => {
    if(!ref.current||flipped) return;
    const r=ref.current.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    setTilt({x:(y-0.5)*-12,y:(x-0.5)*12}); setShine({x:x*100,y:y*100});
  };
  const onLeave=()=>{setTilt({x:0,y:0});setShine({x:50,y:40});};

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <div ref={ref}
        style={{cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.3:1,transition:"opacity 0.3s",width:148,height:208,position:"relative"}}
        onMouseMove={onMove} onMouseLeave={onLeave}
        onClick={()=>!disabled&&!flipped&&onSelect(joker.id)}
      >
        {/* FRONT */}
        <div style={{position:"absolute",inset:0,display:flipped?"none":"block",

          <CardShape accent={joker.accent}>

// ─── JOKERS TAB ───────────────────────────────────────────────────────────────
function JokersTab({ currentUser, players, results, onChooseJokers, onSaveJokers, onActivateJoker }) {
  const player = players.find(p=>p.name===currentUser);
  const [activating, setActivating] = useState(null); // id du joker en cours d'activation
  const [chosenTarget, setChosenTarget] = useState(null);
  const [confirmed, setConfirmed] = useState(false);

  if(!currentUser || !player) return (
    <div style={styles.tabPage}>
      <h2 style={styles.tabTitle}>🃏 Jokers</h2>
      <p style={{...styles.empty, marginTop:40}}>Connecte-toi pour voir tes jokers.</p>
    </div>
  );

  const myJoker = player.jokers || null;
  const usedJokers = player.usedJokers || {};
  const hasJokers = !!(myJoker && myJoker.type);

  // Tous les matchs à venir (pas encore joués)
  const upcomingMatches = Object.entries(GROUPS).flatMap(([grp,{teams,matches}]) =>
    matches.map((m,mIdx) => {
      const key=`${grp}_${mIdx}`;
      const r=(results.groups||{})[key];
      const played=r&&r.h!==""&&r.a!=="";
      return played ? null : { key, label:`${teams[m[0]]} vs ${teams[m[1]]}`, grp, mIdx, flags:`${F(teams[m[0]])} ${F(teams[m[1]])}` };
    }).filter(Boolean)
  );

  const groupKeys = Object.keys(GROUPS);

  const handleActivate = async () => {
    if(!chosenTarget || !activating) return;
    await onActivateJoker(activating, chosenTarget);
    setActivating(null); setChosenTarget(null); setConfirmed(true);
    setTimeout(()=>setConfirmed(false), 3000);
  };

  return (
    <div style={styles.tabPage}>
      <h2 style={styles.tabTitle}>🃏 Jokers</h2>

      {/* Pas encore de jokers */}
      {!hasJokers && (
        <div style={{...styles.section, textAlign:"center", padding:24}}>
          <div style={{fontSize:40, marginBottom:12}}>🃏</div>
          <p style={{color:C.muted, fontSize:14, marginBottom:16}}>Tu n'as pas encore choisi tes jokers.</p>
          <button style={styles.btnGold} onClick={onChooseJokers}>Choisir mes jokers →</button>
        </div>
      )}

      {/* Mes jokers */}
      {hasJokers && (()=>{
        const joker = JOKERS_DATA.find(j=>j.id===myJoker.type);
        if(!joker) return null;
        const isUsed = !!usedJokers[myJoker.type];
        // Résumé de la config
        let configSummary = "";
        if(myJoker.type==="fullday") configSummary = `📅 Journée : ${myJoker.date||"?"}`;
        if(myJoker.type==="sniper") configSummary = `🎯 ${myJoker.team1||"?"} vs ${myJoker.team2||"?"} ${myJoker.score1!==""&&myJoker.score2!==""?`· ${myJoker.score1}-${myJoker.score2}`:""}`;
        if(myJoker.type==="surprise") configSummary = `💥 Match : ${myJoker.matchKey||"?"}`;
        return (
          <div style={styles.section}>
            <div style={{marginBottom:12}}>
              <div style={styles.sectionTitle}>Mon joker · <span style={{color:C.muted,fontSize:10,letterSpacing:1}}>VERROUILLÉ</span></div>
            </div>
            <div style={{...styles.grilleCard, borderColor:`${joker.accent}30`, background:`${joker.accent}08`}}>
              <div style={{fontSize:32, marginRight:14}}>{joker.icon}</div>
              <div style={styles.grilleLeft}>
                <div style={{...styles.grilleName, color:joker.accent}}>{joker.name}</div>
                <div style={styles.grilleStatus}>{configSummary}</div>
                <div style={{...styles.grilleStatus, marginTop:4, color:isUsed?"#00E676":C.muted}}>
                  {isUsed ? "🔥 Utilisé" : "✅ Configuré · En attente"}
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Panneau d'activation */}
      {activating && (()=>{
        const joker = JOKERS_DATA.find(j=>j.id===activating);
        const isJournee = activating==="journee";
        return (
          <div style={{...styles.section, background:`${joker.accent}08`, border:`1px solid ${joker.accent}25`, borderRadius:16, padding:16}}>
            <div style={{...styles.sectionTitle, color:joker.accent}}>{joker.icon} Activer {joker.name}</div>
            <p style={{color:C.muted, fontSize:13, marginBottom:14}}>{joker.desc}</p>

            {/* Joker Journée → choisir un groupe */}
            {isJournee && (
              <>
                <div style={{...styles.sectionTitle, marginBottom:8}}>Choisir un groupe</div>
                <div style={styles.groupTabs}>
                  {groupKeys.map(k=>(
                    <button key={k} style={{...styles.groupTab,...(chosenTarget===k?{...styles.groupTabOn,borderColor:joker.accent,color:joker.accent}:{})}}
                      onClick={()=>setChosenTarget(k)}>Groupe {k}</button>
                  ))}
                </div>
              </>
            )}

            {/* Autres jokers → choisir un match */}
            {!isJournee && (
              <>
                <div style={{...styles.sectionTitle, marginBottom:8}}>Choisir un match</div>
                <div style={{maxHeight:200, overflowY:"auto", display:"flex", flexDirection:"column", gap:6}}>
                  {upcomingMatches.length===0
                    ? <p style={{color:C.muted, fontSize:13}}>Aucun match à venir.</p>
                    : upcomingMatches.map(m=>(
                      <button key={m.key}
                        style={{
                          padding:"10px 14px", textAlign:"left",
                          background: chosenTarget===m.key ? `${joker.accent}15` : "rgba(255,255,255,0.04)",
                          border: `1px solid ${chosenTarget===m.key ? joker.accent : "rgba(255,255,255,0.08)"}`,
                          borderRadius:10, color:C.text, cursor:"pointer",
                          fontFamily:"inherit", fontSize:13,
                        }}
                        onClick={()=>setChosenTarget(m.key)}
                      >
                        {m.flags} {m.label}
                      </button>
                    ))
                  }
                </div>
              </>
            )}

            <div style={{display:"flex", gap:10, marginTop:14}}>
              <button style={{flex:1, padding:12, background:"rgba(255,255,255,0.04)",
                border:"1px solid rgba(255,255,255,0.08)", borderRadius:10,
                color:C.muted, cursor:"pointer", fontFamily:"inherit", fontSize:13}}
                onClick={()=>{setActivating(null);setChosenTarget(null);}}>Annuler</button>
              <button
                style={{flex:2, padding:12,
                  background: chosenTarget ? `linear-gradient(135deg,${joker.accent},${joker.accent}bb)` : "rgba(255,255,255,0.06)",
                  border:"none", borderRadius:10, color: chosenTarget ? "#04060f" : C.muted,
                  fontWeight:700, fontSize:13, cursor: chosenTarget ? "pointer" : "not-allowed",
                  fontFamily:"inherit"}}
                onClick={handleActivate}
                disabled={!chosenTarget}
              >🔥 Confirmer l'activation</button>
            </div>
          </div>
        );
      })()}

      {confirmed && (
        <div style={{margin:"16px 0", padding:14, background:"rgba(0,230,118,0.08)",
          border:"1px solid rgba(0,230,118,0.2)", borderRadius:12,
          textAlign:"center", color:"#00E676", fontWeight:700, fontSize:14}}>
          ✅ Joker activé !
        </div>

      {/* Barème jokers */}

// ─── GRID SCREEN ─────────────────────────────────────────────────────────────
function GridScreen({player,grilleIdx,results,onSave,onBack}){
  const existingPicks=(player?.grilles||[])[grilleIdx]||null;
  const [picks,setPicks]=useState(existingPicks||{groups:{},ko:{r32:[],qf:[],sf:[],final:[]}});
  const [step,setStep]=useState(0);

  const groupKeys=Object.keys(GROUPS);
  const isKO=step===12;
  const grpKey=groupKeys[step];

  const setGroupScore=(matchKey,side,val)=>{
    setPicks(p=>({...p,groups:{...p.groups,[matchKey]:{...(p.groups[matchKey]||{h:"",a:""}), [side]:val}}}));
  };

  const totalGroupMatches=Object.values(GROUPS).reduce((s,g)=>s+g.matches.length,0);
  const filledGroup=Object.keys(picks.groups||{}).filter(k=>{const sc=picks.groups[k];return sc&&sc.h!==""&&sc.a!=="";}).length;
  const progress=Math.round((filledGroup/totalGroupMatches)*100);

  return(
    <div style={styles.app}>
      <Background/>
      <div style={{...styles.content,paddingBottom:24}}>
        {/* Header */}
        <div style={styles.gridHead}>
          <button style={styles.backBtn} onClick={onBack}>←</button>
          <div>
            <div style={styles.gridTitle}>{player?.name}</div>
            <div style={styles.gridSub}>Grille {grilleIdx+1} · {filledGroup}/{totalGroupMatches} matchs</div>
          </div>
          <div style={styles.progressPct}>{progress}%</div>
        </div>

        {/* Barre de progression */}
        <div style={styles.progressBar}><div style={{...styles.progressFill,width:`${progress}%`}}/></div>

        {/* Onglets groupes */}
        <div style={styles.groupTabs}>
          {groupKeys.map((k,i)=>{
            const grpDone=GROUPS[k].matches.every(([a,b],mi)=>{const sc=picks.groups[`${k}_${mi}`];return sc&&sc.h!==""&&sc.a!=="";});
            return(
              <button key={k} style={{...styles.groupTab,...(step===i?styles.groupTabOn:grpDone?styles.groupTabDone:{})}} onClick={()=>setStep(i)}>{k}</button>
            );
          })}
          <button style={{...styles.groupTab,...(step===12?styles.groupTabOn:{})}} onClick={()=>setStep(12)}>KO</button>
        </div>

        {/* Matchs du groupe */}
        {!isKO&&(()=>{
          const {teams,matches}=GROUPS[grpKey];
          return(
            <div style={{padding:"0 14px"}}>
              <div style={styles.sectionTitle}>Groupe {grpKey}</div>
              {matches.map(([i,j],mIdx)=>{
                const key=`${grpKey}_${mIdx}`;
                const sc=picks.groups[key]||{h:"",a:""};
                const tH=teams[i],tA=teams[j];
                const odds=calcOdds(tH,tA);
                const pickedRes=(sc.h!==""&&sc.a!=="")?(parseInt(sc.h)>parseInt(sc.a)?"H":parseInt(sc.h)<parseInt(sc.a)?"A":"N"):null;
                return(
                  <div key={key} style={styles.matchCard}>
                    <div style={styles.matchTeams}>
                      <div style={styles.matchTeamBlock}>
                        <span style={styles.matchFlagLg}>{F(tH)}</span>
                        <span style={styles.matchTeamName}>{tH}</span>
                      </div>
                      <div style={styles.matchScore}>
                        <input style={styles.scoreIn} type="number" min="0" max="20" value={sc.h} placeholder="–"
                          onChange={e=>setGroupScore(key,"h",e.target.value)}/>
                        <span style={styles.matchScoreSep}>:</span>
                        <input style={styles.scoreIn} type="number" min="0" max="20" value={sc.a} placeholder="–"
                          onChange={e=>setGroupScore(key,"a",e.target.value)}/>
                      </div>
                      <div style={{...styles.matchTeamBlock,alignItems:"flex-end"}}>
                        <span style={styles.matchFlagLg}>{F(tA)}</span>
                        <span style={styles.matchTeamName}>{tA}</span>
                      </div>
                    </div>
                    <div style={styles.oddsRow}>
                      {[{l:`1`,v:odds.h,r:"H"},{l:"N",v:odds.n,r:"N"},{l:`2`,v:odds.a,r:"A"}].map(({l,v,r})=>(
                        <div key={r} style={{...styles.oddPill,...(pickedRes===r?styles.oddPillOn:{})}}>
                          <span style={styles.oddPillLabel}>{l}</span>
                          <span style={styles.oddPillVal}>{v.toFixed(2)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}

        {isKO&&(
          <div style={{padding:"0 14px"}}>
            <div style={styles.sectionTitle}>Phases finales</div>
            <div style={styles.koPlaceholder}>
              <div style={{fontSize:40,marginBottom:12}}>🏆</div>
              <p style={{color:C.muted,textAlign:"center",lineHeight:1.6}}>
                Disponible après la phase de groupes<br/>(dès le 29 juin)
              </p>
            </div>
          </div>
        )}

        {/* Navigation */}
        <div style={styles.gridNav}>
          {step>0&&<button style={styles.btnMuted} onClick={()=>setStep(s=>s-1)}>← Préc.</button>}
          {step<12
            ?<button style={styles.btnGold} onClick={()=>setStep(s=>s+1)}>Suivant →</button>
            :<button style={{...styles.btnGold,background:"linear-gradient(135deg,#00E676,#00BFA5)"}} onClick={()=>onSave(picks)}>
              💾 Valider
            </button>
          }
        </div>
      </div>
    </div>
  );
}
